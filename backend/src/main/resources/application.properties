spring.application.name=lifequest
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
springdoc.swagger-ui.path=/swagger.html
springdoc.swagger-ui.disable-swagger-default-url=true

supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

lifequest.groq.api-key=${GROQ_API_KEY:}
# Groq shut down llama-3.3-70b-versatile on 2026-08-16. This is their replacement.
lifequest.groq.model=openai/gpt-oss-120b
lifequest.groq.url=https://api.groq.com/openai/v1/chat/completions

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWT_JWK_SET_URI:${SUPABASE_URL:}/auth/v1/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
server.tomcat.max-swallow-size=-1
